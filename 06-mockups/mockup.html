<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>[שם העסק]: מוקאפ מסכי הזמנה וניהול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Karantina:wght@700&display=swap" rel="stylesheet">
<style>
/* ===== tokens (mirror of design-tokens.md) ===== */
:root{
  --bg:#F3F3F0; --surface:#FFFFFF; --surface-2:#F8F8F6;
  --ink:#16181D; --ink-2:#555A63; --line:#DDDED9; --line-strong:#8A8F98;
  --accent:#A3123F; --accent-press:#8C0F36; --on-accent:#FFFFFF; --accent-soft:#F8E4EB; --accent-soft-ink:#8C0F36;
  --ok:#135E3A; --ok-bg:#E2F2E8; --warn:#7A4700; --warn-bg:#FCEFD7; --danger:#A1221B; --danger-bg:#FBE7E5;
  --day-full-bg:#E6E6E2; --day-full-ink:#4A4E56; --day-closed-bg:#EDEDEA; --hatch:#C9CAC4;
  --focus:#16181D;
  --board:#E2E2DD;
  --shadow-1:0 1px 2px rgba(22,24,29,.06),0 2px 8px rgba(22,24,29,.05);
  --shadow-2:0 8px 28px rgba(22,24,29,.10);
  --r-chip:999px; --r-control:12px; --r-card:16px; --r-sheet:22px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  --font-ui:"IBM Plex Sans Hebrew",system-ui,sans-serif;
  --font-display:"Karantina","IBM Plex Sans Hebrew",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1); --dur-1:120ms; --dur-2:220ms;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131418; --surface:#1C1E23; --surface-2:#22252B;
    --ink:#ECEDEF; --ink-2:#A3A8B1; --line:#2E3138; --line-strong:#6B7079;
    --accent:#C42A5A; --accent-press:#A91F4B; --on-accent:#FFFFFF; --accent-soft:#3A1824; --accent-soft-ink:#F37A9E;
    --ok:#6FD19C; --ok-bg:#16301F; --warn:#F2C274; --warn-bg:#33270F; --danger:#FF8A80; --danger-bg:#3A1A18;
    --day-full-bg:#33363D; --day-full-ink:#B7BBC3; --day-closed-bg:#1C1E23; --hatch:#3A3D44;
    --focus:#ECEDEF; --board:#0C0D10;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 28px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-ui);background:var(--board);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
/* order codes, phone numbers: pinned LTR and isolated so # and - stay put (Rule 26) */
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:inherit}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}

/* ===== board (mockup presentation only, not product UI) ===== */
.board-head{max-width:1640px;margin:0 auto;padding:var(--s8) var(--s6) var(--s4)}
.board-head h1{margin:0;font-size:22px;font-weight:600}
.board-head p{margin:var(--s1) 0 0;color:var(--ink-2);font-size:14px;max-width:80ch}
.board{display:grid;grid-template-columns:repeat(4,390px);gap:24px;justify-content:center;align-items:start;padding:var(--s4) var(--s6) var(--s10)}
.frame-wrap figcaption{font-size:13px;color:var(--ink-2);padding:var(--s2) var(--s1) 0}
.frame-wrap figcaption b{color:var(--ink);font-weight:600}
figure{margin:0}
.phone{width:390px;background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-2);position:relative;min-height:844px;display:flex;flex-direction:column}
@media (max-width:1700px){.board{grid-template-columns:repeat(2,390px)}}
@media (max-width:860px){.board{grid-template-columns:1fr;padding:0;gap:var(--s8)}.phone{width:100%;border-radius:0;box-shadow:none}.board-head{padding:var(--s5) var(--s4) 0}.frame-wrap figcaption{padding:var(--s2) var(--s4) 0}}

/* ===== shared product UI ===== */
.appbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--s4);background:var(--bg)}
.brand{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.2px}
.brand small{font-family:var(--font-ui);font-size:13px;font-weight:500;color:var(--ink-2);margin-inline-start:var(--s2);letter-spacing:0}
.icon-btn{min-width:44px;height:44px;border-radius:var(--r-chip);border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 var(--s3);font-size:15px;font-weight:600}
.icon-btn svg{width:20px;height:20px}
.count{min-width:22px;height:22px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.back{width:44px;height:44px;border-radius:999px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.back svg{width:22px;height:22px}
.screen-title{font-size:18px;font-weight:600;margin:0}
.content{padding:0 var(--s4) var(--s6);flex:1}
.label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
.hint{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.btn{min-height:52px;border-radius:var(--r-control);border:0;padding:0 var(--s5);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;transition:transform var(--dur-1) var(--ease),background-color var(--dur-1) var(--ease)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-press)}
.btn-secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}
.btn .sum{font-weight:500;opacity:.92}
.sticky-cta{position:sticky;bottom:0;padding:var(--s3) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 78%,transparent)}
.section-h{font-size:16px;font-weight:600;margin:var(--s6) 0 var(--s3)}

/* ===== (a) day strip: the one idea ===== */
.days-h{display:flex;align-items:baseline;justify-content:space-between;padding:var(--s2) var(--s4) var(--s2)}
.days-h h2{margin:0;font-size:17px;font-weight:600}
.days-h a{font-size:14px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px var(--s4) var(--s4);scroll-snap-type:x mandatory;scrollbar-width:none}
.day{flex:0 0 auto;scroll-snap-align:start;width:46px;min-height:84px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:6px 0;text-align:center}
.day .dow{font-size:13px;font-weight:500;color:var(--ink-2)}
.day .dnum{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.05}
.day .st{font-size:12px;font-weight:600;line-height:1.2}
.day.open .st{color:var(--ok)}
.day.low .st{color:var(--warn)}
.day.full{background:var(--day-full-bg);border-color:transparent;color:var(--day-full-ink)}
.day.full .dow,.day.full .st{color:var(--day-full-ink)}
.day.full .dnum{opacity:.55}
.day.closed{background:repeating-linear-gradient(-45deg,var(--day-closed-bg) 0 6px,var(--hatch) 6px 7px);border-color:var(--line);color:var(--day-full-ink)}
.day.closed .dnum{opacity:.45}
.day.closed .st,.day.closed .dow{color:var(--day-full-ink)}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel .dow,.day.sel .st{color:var(--bg)}

/* ===== (a) catalog ===== */
.filterline{margin:0 var(--s4) var(--s3);font-size:14px;color:var(--ink-2)}
.filterline b{color:var(--ink);font-weight:600}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4) var(--s3);padding:0 var(--s4)}
.p{display:flex;flex-direction:column;gap:6px;min-width:0}
.p .add{margin-top:auto}
.p.wide{grid-column:1 / -1}
.p .ph{border-radius:var(--r-card);overflow:hidden;aspect-ratio:1/1;background:var(--surface-2)}
.p.wide .ph{aspect-ratio:16/10}
.p .ph img{width:100%;height:100%;object-fit:cover;display:block}
.p h3{margin:2px 0 0;font-size:16px;font-weight:600;line-height:1.3}
.p .row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.price{font-weight:600;font-size:16px;white-space:nowrap}
.unit{font-size:13px;color:var(--ink-2);font-weight:400}
.allergens{font-size:13px;line-height:1.45;color:var(--ink-2);margin:0}
.allergens b{color:var(--ink);font-weight:600}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:var(--r-chip);font-size:12.5px;font-weight:600;border:1px solid var(--line-strong);color:var(--ink);background:var(--surface)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.tag.maybe{border-style:dashed;color:var(--ink-2);font-weight:500}
.p.out .ph img{filter:grayscale(1) contrast(.9);opacity:.55}
.p.out h3,.p.out .price{color:var(--ink-2)}
.state-note{font-size:13px;font-weight:600;color:var(--day-full-ink);background:var(--day-full-bg);border-radius:8px;padding:4px 8px;align-self:flex-start}
.add{min-height:44px;border-radius:var(--r-control);border:1.5px solid var(--ink);background:transparent;font-weight:600;font-size:15px;margin-top:2px}
.add[disabled]{border-color:var(--line);color:var(--ink-2);cursor:not-allowed}
.custom{grid-column:1 / -1;display:grid;grid-template-columns:96px 1fr;gap:var(--s3);align-items:center;background:var(--surface);border-radius:var(--r-card);padding:var(--s3);box-shadow:var(--shadow-1)}
.custom img{width:96px;height:96px;object-fit:cover;border-radius:12px}
.custom h3{margin:0;font-size:16px;font-weight:600}
.custom p{margin:2px 0 6px;font-size:14px;color:var(--ink-2);line-height:1.4}
.custom a{font-size:15px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}

/* ===== (b) checkout ===== */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-control);padding:4px;gap:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:15px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.cal{background:var(--surface);border-radius:var(--r-card);padding:var(--s3) var(--s3) var(--s4);box-shadow:var(--shadow-1)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s2)}
.cal-h b{font-size:16px;font-weight:600}
.cal-h .back{width:44px;height:44px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid7 .wd{font-size:12.5px;font-weight:600;color:var(--ink-2);padding-bottom:4px}
.c{height:48px;border-radius:10px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:500;line-height:1.1;padding:0}
.c small{font-size:10.5px;font-weight:600;line-height:1.1;margin-top:1px}
.c.past{color:var(--ink-2);opacity:.5}
.c.open{border-color:var(--line)}
.c.low{border-color:var(--line)}
.c.low small{color:var(--warn)}
.c.full{background:var(--day-full-bg);color:var(--day-full-ink)}
.c.closed{background:repeating-linear-gradient(-45deg,var(--day-closed-bg) 0 5px,var(--hatch) 5px 6px);color:var(--day-full-ink);border-color:var(--line)}
.c.sel{background:var(--ink);color:var(--bg)}
.c.empty{visibility:hidden}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:var(--s3);font-size:13px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:18px;height:18px;border-radius:5px;flex:0 0 18px;border:1px solid var(--line)}
.sw.full{background:var(--day-full-bg);border-color:transparent}
.sw.closed{background:repeating-linear-gradient(-45deg,var(--day-closed-bg) 0 3px,var(--hatch) 3px 4px)}
.sw.sel{background:var(--ink);border-color:var(--ink)}
.slots{display:flex;gap:var(--s2);flex-wrap:wrap}
.slot{min-height:44px;padding:0 14px;border-radius:var(--r-chip);border:1px solid var(--line-strong);background:var(--surface);font-size:15px;font-weight:500}
.slot[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot[disabled]{border-style:dashed;color:var(--ink-2);background:transparent;text-decoration:line-through}
.field{margin-top:var(--s4)}
.select{position:relative}
.select select{appearance:none;-webkit-appearance:none;width:100%;min-height:52px;border-radius:var(--r-control);border:1.5px solid var(--line-strong);background:var(--surface);padding:0 var(--s4) 0 44px;font-size:16px}
.select svg{position:absolute;inset-inline-end:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);pointer-events:none}
.fee{display:flex;justify-content:space-between;align-items:center;margin-top:var(--s2);padding:10px var(--s3);border-radius:10px;background:var(--accent-soft);color:var(--accent-soft-ink);font-size:14px;font-weight:600}
.sum-card{background:var(--surface);border-radius:var(--r-card);padding:var(--s4);box-shadow:var(--shadow-1);margin-top:var(--s6)}
.sum-row{display:flex;justify-content:space-between;gap:var(--s3);font-size:15px;padding:3px 0}
.sum-row span:first-child{color:var(--ink-2)}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:var(--s2);padding-top:var(--s3)}
.sum-total b{font-size:17px}
.sum-total .big{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:.9}
.fine{font-size:13px;color:var(--ink-2);line-height:1.5;margin:var(--s3) 0 0}

/* ===== (c) payment ===== */
.pay-top{padding:var(--s4) var(--s4) 0}
.saved{font-size:15px;font-weight:600;color:var(--ok);background:var(--ok-bg);border-radius:10px;padding:10px var(--s3);display:flex;gap:var(--s2);align-items:center}
.saved svg{width:20px;height:20px;flex:0 0 20px}
.code-card{margin-top:var(--s4);background:var(--surface);border-radius:var(--r-card);padding:var(--s5) var(--s4);box-shadow:var(--shadow-1)}
.code-card h2{margin:0;font-size:17px;font-weight:600;line-height:1.4}
.code-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-top:var(--s3);border:1.5px dashed var(--line-strong);border-radius:var(--r-control);padding:var(--s2) var(--s2) var(--s2) var(--s4)}
.code{font-family:var(--font-display);font-weight:700;font-size:56px;line-height:1;letter-spacing:1px}
.copy{min-height:44px;padding:0 var(--s4);border-radius:10px;border:1.5px solid var(--ink);background:var(--surface);font-weight:600;font-size:15px}
.amount-line{display:flex;justify-content:space-between;align-items:baseline;margin-top:var(--s4)}
.amount-line .big{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:.9}
.hold{margin-top:var(--s3);font-size:14px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px var(--s3);font-weight:500}
.paybtns{display:grid;gap:var(--s3);margin-top:var(--s5)}
.pay{min-height:56px;border-radius:var(--r-control);display:flex;align-items:center;justify-content:space-between;padding:0 var(--s4);font-size:17px;font-weight:600;border:0;width:100%}
.pay .mark{font-family:system-ui,sans-serif;font-weight:800;letter-spacing:.3px;font-size:15px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.18)}
.pay-a{background:var(--accent);color:var(--on-accent)}
.pay-b{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}
.pay-b:hover{background:var(--surface-2)}
.logo-slot{font-size:11px;font-weight:500;color:var(--ink-2);border:1px dashed var(--line-strong);border-radius:8px;padding:6px 8px}
.steps{margin:var(--s5) 0 0;padding:0;list-style:none;display:grid;gap:var(--s3)}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:var(--s2);font-size:15px;line-height:1.45}
.steps li i{font-style:normal;width:28px;height:28px;border-radius:999px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.biz{margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.6}
.biz-links{display:flex;gap:var(--s4);margin-top:var(--s1)}
.biz-links a{color:var(--ink);min-height:44px;display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:3px}

/* ===== (d) admin ===== */
.admin .appbar{background:var(--surface);border-bottom:1px solid var(--line)}
.admin{background:var(--bg)}
.dayhead{display:flex;align-items:center;justify-content:space-between;margin:var(--s4) 0 var(--s3)}
.dayhead h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:36px;line-height:1}
.dayhead .nav{display:flex;gap:4px}
.nav .back{border:1px solid var(--line);background:var(--surface)}
.cap{background:var(--surface);border-radius:var(--r-card);padding:var(--s4);box-shadow:var(--shadow-1)}
.res{margin-bottom:var(--s4)}
.res:last-of-type{margin-bottom:0}
.res-h{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.res-h b{font-weight:600}
.res-h span{color:var(--ink-2);font-size:14px}
.bar{display:flex;gap:2px;height:28px;margin-top:6px;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);opacity:.88}
.bar i:nth-child(2n){opacity:.7}
.bar i:nth-child(3n){opacity:.55}
.bar .free{flex:1;background:transparent;border:1.5px dashed var(--line-strong);border-radius:0 8px 8px 0;opacity:1}
.bar-legend{font-size:13px;color:var(--ink-2);margin-top:4px}
.edit-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.num-in{display:flex;flex-direction:column}
.num-in input{min-height:48px;border-radius:var(--r-control);border:1.5px solid var(--line-strong);background:var(--surface);padding:0 var(--s3);font-size:17px;font-weight:600;width:100%}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:var(--s4);min-height:44px;font-size:15px}
.switch{width:52px;height:44px;border-radius:999px;background:transparent;position:relative;border:0;padding:0}
.switch::before{content:"";position:absolute;inset-inline:0;top:6px;height:32px;border-radius:999px;background:var(--line-strong)}
.switch::after{content:"";position:absolute;top:9px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:inset-inline-start var(--dur-2) var(--ease)}
.zones{display:grid;gap:var(--s3)}
.zone{background:var(--surface);border-radius:var(--r-card);padding:var(--s3) var(--s4);box-shadow:var(--shadow-1)}
.zone-h{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.zone-h b{font-size:16px;font-weight:600}
.zone-fee{display:flex;align-items:center;gap:6px}
.zone-fee input{width:84px;min-height:44px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);text-align:center;font-weight:600;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.chip{min-height:44px;display:inline-flex;align-items:center;gap:0;padding:0 14px 0 0;border-radius:var(--r-chip);background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.chip button{width:44px;height:44px;border:0;border-radius:999px;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.chip button svg{width:14px;height:14px}
.chip.add-city{border-style:dashed;padding:0 14px;min-height:44px;color:var(--ink);font-weight:600;background:transparent}
.warn-line{font-size:13px;color:var(--ink-2);margin-top:var(--s2)}
